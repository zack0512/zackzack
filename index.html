    <style>
        /* 1. 現代化配色系統 */
        :root {
            color-scheme: light dark;
            
            --primary-color: #2563eb;
            --primary-glow: rgba(37, 99, 235, 0.25);
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);

            --grid-pattern: rgba(0, 0, 0, 0.03);
        }

        /* 手動切換或系統深色 */
        [data-theme="dark"] {
            --primary-color: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.35);
            --bg-gradient: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 20px 35px -5px rgba(0, 0, 0, 0.6), 0 0 20px var(--primary-glow);
            --footer-border: rgba(255, 255, 255, 0.1);
            --grid-pattern: rgba(255, 255, 255, 0.03);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --primary-color: #3b82f6;
                --primary-glow: rgba(59, 130, 246, 0.35);
                --bg-gradient: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
                --card-bg: rgba(30, 41, 59, 0.7);
                --card-border: rgba(255, 255, 255, 0.08);
                --text-color: #f8fafc;
                --text-muted: #94a3b8;
                --shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.3);
                --shadow-hover: 0 20px 35px -5px rgba(0, 0, 0, 0.6), 0 0 20px var(--primary-glow);
                --footer-border: rgba(255, 255, 255, 0.1);
                --grid-pattern: rgba(255, 255, 255, 0.03);
            }
        }

        * { box-sizing: border-box; }

        @media (min-width: 769px) {
            body, a, button, input { cursor: none !important; }
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px 80px 20px;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
            position: relative;
        }

        /* 科技背景網格圖層 */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(var(--grid-pattern) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: -1;
        }

        /* 自訂游標 */
        .cursor-dot {
            width: 8px; height: 8px;
            background-color: var(--primary-color);
            border-radius: 50%;
            position: fixed; top: 0; left: 0;
            transform: translate(-50%, -50%);
            pointer-events: none; z-index: 99999;
        }

        .cursor-outline {
            width: 38px; height: 38px;
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            position: fixed; top: 0; left: 0;
            transform: translate(-50%, -50%);
            pointer-events: none; z-index: 99998;
            opacity: 0.6;
            transition: transform 0.2s ease-out, background-color 0.3s ease;
        }

        .cursor-hover {
            transform: translate(-50%, -50%) scale(1.5);
            background-color: var(--primary-glow);
            opacity: 1;
        }

        @media (max-width: 768px) {
            .cursor-dot, .cursor-outline { display: none !important; }
        }

        /* 搜尋列 */

        /* 網格與 3D 懸停按鈕效果 */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 20px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border: 1px solid var(--card-border);

            border-radius: var(--border-radius);
            font-weight: 600;
            font-size: 0.98rem;
            box-shadow: var(--shadow);
            text-align: center;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;

        }

        .btn.hidden {
            display: none !important;
        }

        /* 光澤高光層 */
        .btn::after {
            content: '';
            position: absolute;
            top: var(--mouse-y, 50%);
            left: var(--mouse-x, 50%);
            width: 180px; height: 180px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .btn:hover::after { opacity: 1; }

        .btn::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            height: 100%; width: 4px;
            background: var(--primary-color);
            opacity: 0;
            transition: opacity 0.25s ease;

        .btn:hover {

            border-color: var(--primary-color);

        /* 彩虹流光按鈕 */
        @keyframes rainbowFlow {

        /* 滑動觸發入場動畫 */

            z-index: 9999;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cookie-banner p { margin: 0; }

        .cookie-btns { display: flex; gap: 8px; }

        .cookie-btns button {
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
        }

        .btn-accept { background-color: var(--primary-color); color: white; }
        .btn-decline { background-color: rgba(255, 255, 255, 0.15); color: white; }

        .btn-accept:hover, .btn-decline:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
    </style>
</head>

    <aside id="cookieBanner" class="cookie-banner" style="display: none;">
        <p>🍪 本網站使用 Cookie 以提供最佳服務與廣告體驗。</p>
        <div class="cookie-btns">
            <button class="btn-accept" onclick="acceptCookie()">同意 (Agree)</button>
            <button class="btn-decline" onclick="declineCookie()">拒絕 (Reject)</button>
        </div>
    </aside>

    <script>
        // 1. Cookie 邏輯
        window.addEventListener('DOMContentLoaded', () => {
            if (!localStorage.getItem('cookieConsent')) {
                document.getElementById('cookieBanner').style.display = 'flex';
            }
        });

        function setConsent(choice) {
            localStorage.setItem('cookieConsent', choice);
            document.getElementById('cookieBanner').style.display = 'none';
        }

        function acceptCookie() { setConsent('accepted'); }
        function declineCookie() { setConsent('declined'); }

        // 2. 自訂游標跟隨腳本
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorOutline = document.querySelector('.cursor-outline');

        window.addEventListener('mousemove', (e) => {
            const posX = e.clientX;
            const posY = e.clientY;

            cursorDot.style.left = `${posX}px`;
            cursorDot.style.top = `${posY}px`;

            cursorOutline.animate({
                left: `${posX}px`,
                top: `${posY}px`
            }, { duration: 250, fill: "forwards" });
        });

        const interactiveElements = document.querySelectorAll('a, button, input');
        interactiveElements.forEach(el => {
            el.addEventListener('mouseenter', () => cursorOutline.classList.add('cursor-hover'));
            el.addEventListener('mouseleave', () => cursorOutline.classList.remove('cursor-hover'));
        });

        // 3. 打字機標題動態效果
        const textToType = "沙特萬能控制板";
        const typewriterEl = document.getElementById('typewriter');
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < textToType.length) {
                typewriterEl.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 120);
            }
        }
        setTimeout(typeWriter, 300);

        // 4. 3D 卡片懸停與滑鼠互動
        const tiltCards = document.querySelectorAll('.tilt-effect');

        tiltCards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -12;
                const rotateY = ((x - centerX) / centerX) * 12;

                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(8px)`;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px)';
            });
        });

        // 5. 滾動/滑動觸發 (IntersectionObserver)
        const revealElements = document.querySelectorAll('.reveal');

        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        entry.target.classList.add('active');
                    }, index * 35);
                    revealObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

        revealElements.forEach(el => revealObserver.observe(el));

        // 6. 即時搜尋與快捷鍵支援
        const searchInput = document.getElementById('searchInput');
        const searchItems = document.querySelectorAll('.search-item');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();

            searchItems.forEach(item => {
                const text = item.textContent.toLowerCase();
                if (text.includes(query)) {
                    item.classList.remove('hidden');
                } else {
                    item.classList.add('hidden');
                }
            });
        });

        // 快捷鍵按下 '/' 自動聚焦搜尋框，'Escape' 清空
        window.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
            } else if (e.key === 'Escape' && document.activeElement === searchInput) {
                searchInput.value = '';
                searchInput.dispatchEvent(new Event('input'));
                searchInput.blur();
            }
        });

        // 7. 手動切換主題 (Light/Dark Theme Toggle)
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const savedTheme = localStorage.getItem('user-theme') || 'dark';

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            themeToggleBtn.textContent = theme === 'dark' ? '☀️ 亮色模式' : '🌙 暗色模式';
            localStorage.setItem('user-theme', theme);
        }

        applyTheme(savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        // 8. 動態招呼語與時間顯示
        function updateGreeting() {
            const greetingEl = document.getElementById('greetingTime');
            const now = new Date();
            const hours = now.getHours();
            let periodGreeting = "👋 歡迎來到";

            if (hours >= 5 && hours < 12) periodGreeting = "🌅 早上好！歡迎來到";
            else if (hours >= 12 && hours < 18) periodGreeting = "☀️ 午安！歡迎來到";
            else periodGreeting = "🌙 晚上好！歡迎來到";

            const timeString = now.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' });
            greetingEl.textContent = `${periodGreeting} | 當前時間 ${timeString}`;
        }

        updateGreeting();
        setInterval(updateGreeting, 10000); // 每 10 秒更新一次
    </script>
</body>
</html>
