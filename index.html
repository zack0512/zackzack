/* 1. 彩虹流光背景動畫 */
@keyframes rainbowFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* 2. 霓虹燈閃爍與呼吸放大動畫 */
@keyframes neonBlinkPulse {
    0%, 100% {
        opacity: 1;
        filter: drop-shadow(0 0 12px rgba(255, 0, 128, 0.9)) drop-shadow(0 0 25px rgba(0, 240, 255, 0.8));
        transform: scale(1);

}
