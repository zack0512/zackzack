<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- AdSense 驗證標籤 -->
    <meta name="google-adsense-account" content="ca-pub-1973255703694706">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1973255703694706"
     crossorigin="anonymous"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沙特萬能控制板</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f9f9f9;
            padding-bottom: 70px; /* 預留底部空間給 Cookie 提示 */
        }
        h1 {
            color: #333;
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 250px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
        }
        .btn:hover {
            background-color: #0056b3;
        }

        @keyframes rainbowFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes neonBlinkPulse {
            0%, 100% {
                opacity: 1;
                filter: drop-shadow(0 0 12px rgba(255, 0, 128, 0.9)) drop-shadow(0 0 25px rgba(0, 240, 255, 0.8));
                transform: scale(1);
            }
            50% {
                opacity: 0.85;
                filter: drop-shadow(0 0 25px rgba(255, 230, 0, 1)) drop-shadow(0 0 40px rgba(255, 0, 200, 0.9));
                transform: scale(1.04);
            }
        }

        .btn-colorful-flash {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 0.5px;
            background: linear-gradient(124deg, #ff2400, #e81d1d, #e8b71d, #1de840, #1ddde8, #dd00f3, #ff007f);
            background-size: 300% 300%;
            animation: rainbowFlow 3s ease infinite, neonBlinkPulse 1.2s ease-in-out infinite;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s ease;
        }

        .btn-colorful-flash:active {
            transform: scale(0.95) !important;
        }

        /* 🍪 Cookie 同意橫幅樣式 */
        .cookie-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #222222;
            color: #ffffff;
            padding: 12px 20px;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 9999;
            font-size: 14px;
        }
        .cookie-banner p {
            margin: 0;
        }
        .cookie-btns button {
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-accept {
            background-color: #28a745;
            color: white;
        }
        .btn-accept:hover {
            background-color: #218838;
        }
        .btn-decline {
            background-color: #6c757d;
            color: white;
        }
        .btn-decline:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <h1>沙特萬能控制板</h1>

    <div class="menu">
        <a href="https://www.roblox.com/download" class="btn" target="_blank">點擊下載roblox</a>
        <a href="https://www.google.com" class="btn" target="_blank">新增google分頁</a>
        <a href="https://mail.google.com/mail/mu/mp/635/" class="btn" target="_blank">前往gmail</a>
        <a href="https://workspace.google.com/intl/zh-TW/products/drive/" class="btn" target="_blank">前往雲端硬碟</a>
        <a href="https://edu.google.com/intl/ALL_tw/workspace-for-education/products/classroom/" class="btn" target="_blank">前往classroom</a>
        <a href="https://www.youtube.com/" class="btn" target="_blank">前往YouTube</a>
        <a href="https://www.crazygames.com/" class="btn" target="_blank">前往crazy game</a>
        <a href="https://zack0512.github.io/joke" class="btn" target="_blank">前往每週笑話</a>

        <a href="https://zack0512.github.io/snake/" class="btn-colorful-flash" target="_blank">
            <span>前往沙特貪吃蛇（終極版）</span>
        </a>
    </div>

    <hr style="margin-top: 30px;">

    <div>
        <small>有意製作網站，請洽沙特本人</small><br>
        <small>©2026沙特 v.1.05</small>
    </div>

    <!-- 🍪 Cookie 同意橫幅 -->
    <div id="cookieBanner" class="cookie-banner" style="display: none;">
        <p>🍪 本網站使用 Cookie 以提供最佳服務與廣告體驗。</p>
        <div class="cookie-btns">
            <button class="btn-accept" onclick="acceptCookie()">同意</button>
            <button class="btn-decline" onclick="declineCookie()">拒絕</button>
        </div>
    </div>

    <script>
        // 檢查是否已儲存過使用者的選擇
        window.onload = function() {
            if (!localStorage.getItem('cookieConsent')) {
                document.getElementById('cookieBanner').style.display = 'flex';
            }
        };

        function acceptCookie() {
            localStorage.setItem('cookieConsent', 'accepted');
            document.getElementById('cookieBanner').style.display = 'none';
        }

        function declineCookie() {
            localStorage.setItem('cookieConsent', 'declined');
            document.getElementById('cookieBanner').style.display = 'none';
        }
    </script>

</body>
</html>
