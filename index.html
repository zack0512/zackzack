    <style>
        /* 1. 現代化配色系統 */
        :root {
            color-scheme: light dark;
            
            --primary-color: #2563eb;
            --primary-glow: rgba(37, 99, 235, 0.2);
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(226, 232, 240, 0.8);
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 12px 20px -3px rgba(37, 99, 235, 0.15), 0 4px 6px -4px rgba(37, 99, 235, 0.1);
            --footer-border: rgba(203, 213, 225, 0.6);
        }

        /* 2. 深色模式精細優化 */
        @media (prefers-color-scheme: dark) {
            :root {
                --primary-color: #3b82f6;
                --primary-glow: rgba(59, 130, 246, 0.3);
                --bg-gradient: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
                --card-bg: rgba(30, 41, 59, 0.7);
                --card-border: rgba(255, 255, 255, 0.08);
                --text-color: #f8fafc;
                --text-muted: #94a3b8;
                --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
                --shadow-hover: 0 12px 24px -4px rgba(0, 0, 0, 0.5), 0 0 12px var(--primary-glow);
                --footer-border: rgba(255, 255, 255, 0.1);
            }
        }

        * {
            box-sizing: border-box;
        }

        @media (min-width: 769px) {
            body, a, button, input {
                cursor: none !important;
            }
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px 80px 20px;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* 自訂游標 */
        .cursor-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary-color);
            border-radius: 50%;
            position: fixed;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 99999;
        }

        .cursor-outline {
            width: 38px;
            height: 38px;
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            position: fixed;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 99998;
            opacity: 0.6;
            transition: transform 0.2s ease-out, background-color 0.3s ease;
        }

        .cursor-hover {
            transform: translate(-50%, -50%) scale(1.5);
            background-color: var(--primary-glow);
            opacity: 1;
        }

        @media (max-width: 768px) {
            .cursor-dot, .cursor-outline { display: none !important; }
        }

        /* 標頭與 Logo 區域 */
        header {
            text-align: center;
            margin-bottom: 32px;
            width: 100%;
            max-width: 840px;
        }

        .brand-badge {
            display: inline-block;
            padding: 4px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--primary-color);
            background: var(--primary-glow);
            border-radius: 20px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--text-color) 30%, var(--primary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .survey-prompt {
            margin: 8px 0 0 0;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        main {
            width: 100%;
            max-width: 840px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* 網格與按鈕升級 */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 20px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-color);
            border: 1px solid var(--card-border);
            text-decoration: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            font-size: 0.98rem;
            box-shadow: var(--shadow);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--primary-color);
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .btn:hover {
            background: var(--card-bg);
            color: var(--primary-color);
            border-color: var(--primary-color);
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        .btn:hover::before {
            opacity: 1;
        }

        /* 彩虹按鈕升級 */
        @keyframes rainbowFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-colorful-flash {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 28px;
            border-radius: var(--border-radius);
            text-decoration: none;
            color: #ffffff;
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            background: linear-gradient(124deg, #ff2400, #e81d1d, #e8b71d, #1de840, #1ddde8, #dd00f3, #ff007f);
            background-size: 300% 300%;
            animation: rainbowFlow 4s ease infinite;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            max-width: 320px;
        }

        .btn-colorful-flash:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
        }

        .btn-colorful-flash:active {
            transform: scale(0.97) !important;
        }

        /* 頁尾升級 */
        footer {
            margin-top: 60px;
            text-align: center;
            color: var(--text-muted);
            border-top: 1px solid var(--footer-border);
            padding-top: 24px;
            width: 100%;
            max-width: 840px;
            font-size: 0.9rem;
        }

        footer p {
            margin: 6px 0;
        }

        /* Cookie Banner */
        .cookie-banner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 600px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            color: #ffffff;
            padding: 16px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            z-index: 9999;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cookie-banner p { margin: 0; }

        .cookie-btns {
            display: flex;
            gap: 8px;
        }

        .cookie-btns button {
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
        }

        .btn-accept {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-decline {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .btn-accept:hover, .btn-decline:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <footer>
        <p><strong>有意製作網站，請洽沙特本人</strong></p>
        <p><small>劉大維好棒</small></p>
        <p><small>© 2026 沙特 v.1.09</small></p>
    </footer>

    <aside id="cookieBanner" class="cookie-banner" style="display: none;">
        <p>🍪 本網站使用 Cookie 以提供最佳服務與廣告體驗。</p>
        <div class="cookie-btns">
            <button class="btn-accept" onclick="acceptCookie()">同意 (Agree)</button>
            <button class="btn-decline" onclick="declineCookie()">拒絕 (Reject)</button>
        </div>
    </aside>

    <script>
        // Cookie 邏輯
        window.addEventListener('DOMContentLoaded', () => {
            if (!localStorage.getItem('cookieConsent')) {
                document.getElementById('cookieBanner').style.display = 'flex';
            }
        });

        function setConsent(choice) {
            localStorage.setItem('cookieConsent', choice);
            document.getElementById('cookieBanner').style.display = 'none';
        }

        function acceptCookie() { setConsent('accepted'); }
        function declineCookie() { setConsent('declined'); }

        // 自訂游標腳本
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorOutline = document.querySelector('.cursor-outline');

        window.addEventListener('mousemove', (e) => {
            const posX = e.clientX;
            const posY = e.clientY;

            cursorDot.style.left = `${posX}px`;
            cursorDot.style.top = `${posY}px`;

            cursorOutline.animate({
                left: `${posX}px`,
                top: `${posY}px`
            }, { duration: 250, fill: "forwards" });
        });

        const interactiveElements = document.querySelectorAll('a, button');
        interactiveElements.forEach(el => {
            el.addEventListener('mouseenter', () => cursorOutline.classList.add('cursor-hover'));
            el.addEventListener('mouseleave', () => cursorOutline.classList.remove('cursor-hover'));
        });
    </script>
