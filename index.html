    <style>
        /* 1. 現代化配色系統 */
        :root {
            color-scheme: light dark;
            
            --primary-color: #2563eb;
            --primary-glow: rgba(37, 99, 235, 0.25);
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(226, 232, 240, 0.8);
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-radius: 14px;
            --shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.05), 0 3px 6px -3px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 20px 30px -10px rgba(37, 99, 235, 0.25);
            --footer-border: rgba(203, 213, 225, 0.6);
        }

        /* 2. 深色模式優化 */
        @media (prefers-color-scheme: dark) {
            :root {
                --primary-color: #3b82f6;
                --primary-glow: rgba(59, 130, 246, 0.35);
                --bg-gradient: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
                --card-bg: rgba(30, 41, 59, 0.7);
                --card-border: rgba(255, 255, 255, 0.08);
                --text-color: #f8fafc;
                --text-muted: #94a3b8;
                --shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.3);
                --shadow-hover: 0 20px 35px -5px rgba(0, 0, 0, 0.6), 0 0 20px var(--primary-glow);
                --footer-border: rgba(255, 255, 255, 0.1);
            }
        }

        * {
            box-sizing: border-box;
        }

        @media (min-width: 769px) {
            body, a, button, input {
                cursor: none !important;
            }
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px 80px 20px;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* 自訂游標 */
        .cursor-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary-color);
            border-radius: 50%;
            position: fixed;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 99999;
        }

        .cursor-outline {
            width: 38px;
            height: 38px;
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            position: fixed;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 99998;
            opacity: 0.6;
            transition: transform 0.2s ease-out, background-color 0.3s ease;
        }

        .cursor-hover {
            transform: translate(-50%, -50%) scale(1.5);
            background-color: var(--primary-glow);
            opacity: 1;
        }

        @media (max-width: 768px) {
            .cursor-dot, .cursor-outline { display: none !important; }
        }

        /* 標頭與 Logo 區域 */
        header {
            text-align: center;
            margin-bottom: 36px;
            width: 100%;
            max-width: 840px;
        }

        .brand-badge {
            display: inline-block;
            padding: 5px 14px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: var(--primary-color);
            background: var(--primary-glow);
            border-radius: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
            box-shadow: 0 2px 10px var(--primary-glow);
        }

        /* 打字機效果標題 */
        h1 {
            margin: 0 0 20px 0;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            min-height: 3.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--text-color) 30%, var(--primary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .typewriter-cursor {
            display: inline-block;
            width: 4px;
            height: 2.2rem;
            background-color: var(--primary-color);
            margin-left: 6px;
            border-radius: 2px;
            animation: blink 0.8s infinite;
            -webkit-text-fill-color: initial;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .header-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .survey-prompt {
            margin: 8px 0 0 0;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        main {
            width: 100%;
            max-width: 840px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* 網格與 3D 懸停按鈕效果 */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;
            width: 100%;
            perspective: 1000px; /* 啟用 3D 透視 */
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 20px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--text-color);
            border: 1px solid var(--card-border);
            text-decoration: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            font-size: 0.98rem;
            box-shadow: var(--shadow);
            text-align: center;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out, box-shadow 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }

        /* 光澤高光層（Mouse Light Spot） */
        .btn::after {
            content: '';
            position: absolute;
            top: var(--mouse-y, 50%);
            left: var(--mouse-x, 50%);
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .btn:hover::after {
            opacity: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--primary-color);
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .btn:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
            box-shadow: var(--shadow-hover);
        }

        .btn:hover::before {
            opacity: 1;
        }

        /* 彩虹流光按鈕 + 3D 透視支援 */
        @keyframes rainbowFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-colorful-flash {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 28px;
            border-radius: var(--border-radius);
            text-decoration: none;
            color: #ffffff;
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            background: linear-gradient(124deg, #ff2400, #e81d1d, #e8b71d, #1de840, #1ddde8, #dd00f3, #ff007f);
            background-size: 300% 300%;
            animation: rainbowFlow 4s ease infinite;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 320px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out, box-shadow 0.25s ease;
        }

        .btn-colorful-flash:hover {
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.3);
        }

        /* 滑動觸發入場動畫（Scroll Triggered Entrance） */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* 頁尾升級 */
        footer {
            margin-top: 60px;
            text-align: center;
            color: var(--text-muted);
            border-top: 1px solid var(--footer-border);
            padding-top: 24px;
            width: 100%;
            max-width: 840px;
            font-size: 0.9rem;
        }

        footer p {
            margin: 6px 0;
        }

        /* Cookie Banner */
        .cookie-banner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 600px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            color: #ffffff;
            padding: 16px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            z-index: 9999;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cookie-banner p { margin: 0; }

        .cookie-btns {
            display: flex;
            gap: 8px;
        }

        .cookie-btns button {
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
        }

        .btn-accept {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-decline {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .btn-accept:hover, .btn-decline:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
    </style>
</head>

    <aside id="cookieBanner" class="cookie-banner" style="display: none;">
        <p>🍪 本網站使用 Cookie 以提供最佳服務與廣告體驗。</p>
        <div class="cookie-btns">
            <button class="btn-accept" onclick="acceptCookie()">同意 (Agree)</button>
            <button class="btn-decline" onclick="declineCookie()">拒絕 (Reject)</button>
        </div>
    </aside>

    <script>
        // 1. Cookie 邏輯
        window.addEventListener('DOMContentLoaded', () => {
            if (!localStorage.getItem('cookieConsent')) {
                document.getElementById('cookieBanner').style.display = 'flex';
            }
        });

        function setConsent(choice) {
            localStorage.setItem('cookieConsent', choice);
            document.getElementById('cookieBanner').style.display = 'none';
        }

        function acceptCookie() { setConsent('accepted'); }
        function declineCookie() { setConsent('declined'); }

        // 2. 自訂游標跟隨腳本
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorOutline = document.querySelector('.cursor-outline');

        window.addEventListener('mousemove', (e) => {
            const posX = e.clientX;
            const posY = e.clientY;

            cursorDot.style.left = `${posX}px`;
            cursorDot.style.top = `${posY}px`;

            cursorOutline.animate({
                left: `${posX}px`,
                top: `${posY}px`
            }, { duration: 250, fill: "forwards" });
        });

        const interactiveElements = document.querySelectorAll('a, button');
        interactiveElements.forEach(el => {
            el.addEventListener('mouseenter', () => cursorOutline.classList.add('cursor-hover'));
            el.addEventListener('mouseleave', () => cursorOutline.classList.remove('cursor-hover'));
        });

        // 3. 打字機標題動態效果
        const textToType = "沙特萬能控制板";
        const typewriterEl = document.getElementById('typewriter');
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < textToType.length) {
                typewriterEl.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 120);
            }
        }
        // 開頁延遲開始打字
        setTimeout(typeWriter, 300);

        // 4. 3D 卡片懸停與滑鼠互動（3D Tilt + Light Glow）
        const tiltCards = document.querySelectorAll('.tilt-effect');

        tiltCards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // 計算傾斜角度 (最大 12 度)
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -12;
                const rotateY = ((x - centerX) / centerX) * 12;

                // 更新 3D 傾斜與滑鼠位置變數
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(8px)`;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            });

            card.addEventListener('mouseleave', () => {
                // 恢復原位
                card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px)';
            });
        });

        // 5. 滾動/滑動觸發與交錯入場動畫 (IntersectionObserver)
        const revealElements = document.querySelectorAll('.reveal');

        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    // 交錯延遲 (Stagger Delay)
                    setTimeout(() => {
                        entry.target.classList.add('active');
                    }, index * 40);
                    revealObserver.unobserve(entry.target);
                }
            });
        }, {
            threshold: 0.1,
            rootMargin: '0px 0px -40px 0px'
        });

        revealElements.forEach(el => revealObserver.observe(el));
    </script>
